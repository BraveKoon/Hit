# Fly.io 배포 설정. .github/workflows/deploy-server.yml 이 이 파일로 배포합니다.
# 서버는 경기를 계속 지켜보며 알림을 보내야 해서 꺼지지 않게 한 대만 상시로 둡니다.
app = 'hit-server-bravekoon'
primary_region = 'nrt'   # 도쿄 (서울 리전 없음)

[build]
  dockerfile = 'Dockerfile'

[env]
  PORT = '8787'
  HIT_DB = '/data/hit.db'
  HIT_PROVIDER = 'naver'

# 구독·글·기록을 담는 SQLite 파일이 사는 디스크
[[mounts]]
  source = 'hit_data'
  destination = '/data'
  initial_size = '1gb'

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = '20s'
    interval = '30s'
    timeout = '5s'
    method = 'GET'
    path = '/health'

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
