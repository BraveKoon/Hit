# XcodeGen 프로젝트 정의. Mac 에서:  brew install xcodegen && xcodegen  → HIT.xcodeproj 생성
name: HIT
options:
  bundleIdPrefix: com.yourname
  deploymentTarget:
    iOS: "17.2"
  developmentLanguage: ko
  createIntermediateGroups: true

settings:
  base:
    # ↓ 본인 것으로 바꾸세요. 번들 ID는 서버의 APNS_BUNDLE_ID 와 같아야 합니다.
    APP_BUNDLE_ID: com.yourname.hit
    APP_GROUP_ID: group.com.yourname.hit
    DEVELOPMENT_TEAM: ""
    # 시뮬레이터에선 localhost, 실제 아이폰에선 배포한 서버 주소 (https 권장)
    HIT_API_BASE_URL: http://localhost:8787
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  HIT:
    type: application
    platform: iOS
    sources:
      - path: HIT
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
    info:
      path: HIT/Info.plist
      properties:
        CFBundleDisplayName: HIT
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: LaunchLogo
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIUserInterfaceStyle: Dark
        UIBackgroundModes: [remote-notification, audio]
        NSSupportsLiveActivities: true
        NSSupportsLiveActivitiesFrequentUpdates: true
        ITSAppUsesNonExemptEncryption: false
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        CFBundleURLTypes:
          - CFBundleURLName: hit
            CFBundleURLSchemes: [hit]
          - CFBundleURLName: google
            CFBundleURLSchemes: [com.googleusercontent.apps.259513225241-se1scmqbdftml01khktdedg2kfklalkh]
        HITAPIBaseURL: $(HIT_API_BASE_URL)
        HITAppGroup: $(APP_GROUP_ID)
        UIAppFonts: &fonts [Pretendard-Regular.otf, Pretendard-Medium.otf, Pretendard-SemiBold.otf, Pretendard-Bold.otf, Pretendard-ExtraBold.otf]
    entitlements:
      path: HIT/HIT.entitlements
      properties:
        aps-environment: development
        com.apple.developer.usernotifications.time-sensitive: true
        com.apple.developer.applesignin: [Default]
        com.apple.security.application-groups: [$(APP_GROUP_ID)]
    dependencies:
      - target: HITWidgets
        embed: true
      - target: HITNotificationService
        embed: true

  HITWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: HITWidgets
      - path: Shared
      - path: HIT/Resources      # 위젯도 경기 데이터를 직접 가져온다 (hit-core.js)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).widgets
        TARGETED_DEVICE_FAMILY: "1"
    info:
      path: HITWidgets/Info.plist
      properties:
        CFBundleDisplayName: HIT 위젯
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        HITAPIBaseURL: $(HIT_API_BASE_URL)
        HITAppGroup: $(APP_GROUP_ID)
        UIAppFonts: *fonts
    entitlements:
      path: HITWidgets/HITWidgets.entitlements
      properties:
        com.apple.security.application-groups: [$(APP_GROUP_ID)]

  # 알림 서비스 확장: 푸시에 실린 선수 사진을 받아 알림에 붙인다
  HITNotificationService:
    type: app-extension
    platform: iOS
    sources:
      - path: HITNotificationService
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).notification-service
        TARGETED_DEVICE_FAMILY: "1"
    info:
      path: HITNotificationService/Info.plist
      properties:
        CFBundleDisplayName: HIT 알림
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationService
