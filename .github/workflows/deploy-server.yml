name: Deploy server

# Actions 탭 → Deploy server → Run workflow. 처음엔 Fly 앱과 디스크도 만듭니다.
# 필요한 것: Secrets 의 FLY_API_TOKEN (fly.io 대시보드에서 만든 조직 토큰).
# 있으면 서버에 함께 넣는 값(Secrets): NAVER_CLIENT_ID, NAVER_CLIENT_SECRET, KAKAO_REST_API_KEY, KAKAO_CLIENT_SECRET,
#   APNS_KEY_ID, APNS_TEAM_ID, APNS_KEY_P8 (.p8 원문), HIT_WEATHER_KEY. 번들 ID 는 Variables 의 APP_BUNDLE_ID.
on:
  workflow_dispatch:
    inputs:
      org:
        description: "Fly 조직 이름 (개인 계정이면 personal)"
        required: false
        default: "personal"

concurrency: deploy-server

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      ORG: ${{ inputs.org }}
      APNS_BUNDLE_ID: ${{ vars.APP_BUNDLE_ID }}
      NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
      NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
      KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
      KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
      APNS_KEY_ID: ${{ secrets.APNS_KEY_ID }}
      APNS_TEAM_ID: ${{ secrets.APNS_TEAM_ID }}
      APNS_KEY_P8: ${{ secrets.APNS_KEY_P8 }}
      HIT_WEATHER_KEY: ${{ secrets.HIT_WEATHER_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: 설정 확인
        run: |
          [ -n "$FLY_API_TOKEN" ] || { echo "::error::Secrets 에 FLY_API_TOKEN 이 없습니다 (fly.io 대시보드 → Tokens 에서 만든 값)"; exit 1; }
          APP=$(sed -n "s/^app = '\(.*\)'/\1/p" server/fly.toml)
          echo "APP=$APP" >> "$GITHUB_ENV"
          echo "앱 이름: $APP"

      - name: 앱과 디스크 만들기 (처음 한 번)
        working-directory: server
        run: |
          if flyctl status -a "$APP" >/dev/null 2>&1; then
            echo "앱이 이미 있습니다"
          else
            flyctl apps create "$APP" --org "${ORG:-personal}"
          fi
          if flyctl volumes list -a "$APP" 2>/dev/null | grep -q hit_data; then
            echo "디스크가 이미 있습니다"
          else
            flyctl volumes create hit_data --size 1 --region nrt -a "$APP" --yes
          fi

      - name: 서버 값 넣기
        working-directory: server
        run: |
          ARGS=("PUBLIC_BASE_URL=https://${APP}.fly.dev")
          [ -n "$APNS_BUNDLE_ID" ] && ARGS+=("APNS_BUNDLE_ID=$APNS_BUNDLE_ID")
          for n in NAVER_CLIENT_ID NAVER_CLIENT_SECRET KAKAO_REST_API_KEY KAKAO_CLIENT_SECRET APNS_KEY_ID APNS_TEAM_ID HIT_WEATHER_KEY; do
            [ -n "${!n}" ] && ARGS+=("$n=${!n}")
          done
          if [ -n "$APNS_KEY_P8" ]; then
            # 붙여 넣다 깨진 .p8 도 BEGIN/END 사이만 뽑아 다시 조립해 \n 으로 이은 한 줄로 넣는다
            BODY=$(printf '%s' "$APNS_KEY_P8" | tr '\r\n' '  ' | sed -e 's/^.*-----BEGIN [A-Z ]*-----//' -e 's/-----END [A-Z ]*-----.*$//' | tr -d ' \t"')
            PEM=$(printf '%s' "$BODY" | fold -w 64)
            ARGS+=("APNS_KEY=-----BEGIN PRIVATE KEY-----\\n$(printf '%s' "$PEM" | tr '\n' '|' | sed 's/|/\\n/g')\\n-----END PRIVATE KEY-----")
          fi
          flyctl secrets set "${ARGS[@]}" -a "$APP" --stage
          echo "넣은 값: $(printf '%s\n' "${ARGS[@]}" | sed 's/=.*//' | tr '\n' ' ')"

      - name: 배포
        working-directory: server
        run: flyctl deploy --remote-only --ha=false -a "$APP"

      - name: 켜졌는지 확인
        run: |
          for i in $(seq 1 20); do
            R=$(curl -fsS "https://${APP}.fly.dev/health" 2>/dev/null) && { echo "서버 주소: https://${APP}.fly.dev"; echo "$R"; exit 0; }
            sleep 6
          done
          echo "::error::https://${APP}.fly.dev/health 가 응답하지 않습니다 (flyctl logs 확인)"; exit 1
