name: probe-sportradar
on:
  push:
    branches: [claude/probe-sportradar]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Sportradar Global Baseball 체험 키로 KBO 데이터 확인 (키는 출력하지 않음)
        env:
          SR_KEY: ${{ secrets.SPORTRADAR_KEY }}
        run: |
          set -u
          base=https://api.sportradar.com/baseball/trial/v2/en
          get() { curl -sS -m 30 -D /tmp/h.txt -H "x-api-key: $SR_KEY" -H 'accept: application/json' -o "$2" -w '[%{http_code}] ' "$base/$1"; echo "$1"; grep -iE '^(x-ratelimit|x-plan|x-forwarded-qps|retry-after)' /tmp/h.txt || true; }
          day=$(date -u +%F)
          get "schedules/$day/summaries.json" /tmp/day.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/day.json'))
          s=d.get('summaries',[])
          print('UTC 오늘 경기 수:',len(s))
          comps={}
          kbo=[]
          for x in s:
              se=x['sport_event']; c=se.get('sport_event_context',{}).get('competition',{}).get('name')
              comps[c]=comps.get(c,0)+1
              if c and 'KBO' in c: kbo.append(x)
          print('대회별:',comps)
          for x in kbo:
              se=x['sport_event']; st=x.get('sport_event_status',{})
              print('KBO', se['id'], se['start_time'], [t.get('name') for t in se['competitors']], st.get('status'), st.get('match_status'), st.get('home_score'), st.get('away_score'))
          json.dump([x['sport_event']['id'] for x in kbo], open('/tmp/kbo_ids.json','w'))
          if kbo: print('첫 KBO 요약 키:', sorted(kbo[0].keys()))
          PY
          echo '--- 라이브 타임라인(전체 중 KBO 있는지)'
          get "schedules/live/timelines.json" /tmp/live.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/live.json'))
          print('최상위 키:',list(d.keys()))
          ids=set(json.load(open('/tmp/kbo_ids.json')))
          t=d.get('sport_event_timelines') or d.get('timelines') or []
          print('라이브 경기 수:',len(t))
          for x in t:
              if x.get('id') in ids or x.get('sport_event',{}).get('id') in ids:
                  tl=x.get('timeline',[])
                  print('KBO 라이브', x.get('id'), '이벤트 수', len(tl))
                  print('최상위 키:', sorted(x.keys()), '/ 상태:', json.dumps(x.get('sport_event_status',{}),ensure_ascii=False)[:400])
                  print('이벤트 종류:', sorted({e.get('type') for e in tl}))
                  for e in tl[-4:]: print(json.dumps(e,ensure_ascii=False)[:700])
          PY
      - name: 한국어(ko) 지원 여부와 KBO 팀·선수 이름 형식
        env:
          SR_KEY: ${{ secrets.SPORTRADAR_KEY }}
        run: |
          set -u
          day=$(date -u +%F)
          for lang in ko en; do
            code=$(curl -sS -m 30 -H "x-api-key: $SR_KEY" -o /tmp/d_$lang.json -w '%{http_code}' "https://api.sportradar.com/baseball/trial/v2/$lang/schedules/$day/summaries.json")
            echo "언어 $lang -> HTTP $code"
          done
          python3 - <<'PY'
          import json
          for lang in ('ko','en'):
              try:
                  d=json.load(open(f'/tmp/d_{lang}.json'))
              except Exception as e:
                  print(lang,'읽기 실패',e); continue
              for x in d.get('summaries',[]):
                  se=x['sport_event']
                  if 'KBO' in str(se.get('sport_event_context',{}).get('competition',{}).get('name')):
                      print(lang,[ (c.get('id'),c.get('name'),c.get('abbreviation')) for c in se['competitors']])
                      ids=[c['id'] for c in se['competitors']]
                      json.dump(ids,open('/tmp/team_ids.json','w'))
          PY
          ids=$(python3 -c "import json;print(' '.join(json.load(open('/tmp/team_ids.json'))))")
          for id in $ids; do
            code=$(curl -sS -m 30 -H "x-api-key: $SR_KEY" -o /tmp/prof.json -w '%{http_code}' "https://api.sportradar.com/baseball/trial/v2/ko/competitors/$id/profile.json")
            echo "프로필 $id -> HTTP $code"
            python3 - <<'PY'
          import json
          try:
              d=json.load(open('/tmp/prof.json'))
              ps=d.get('players',[])
              print('선수 수:',len(ps))
              for p in ps[:6]: print({k:p.get(k) for k in ('id','name','jersey_number','type','date_of_birth')})
          except Exception as e: print('프로필 읽기 실패',e)
          PY
          done
      - name: 라인업 확인 (경기 요약·라인업 엔드포인트)
        env:
          SR_KEY: ${{ secrets.SPORTRADAR_KEY }}
        run: |
          set -u
          base=https://api.sportradar.com/baseball/trial/v2/ko
          id=sr:sport_event:76122370
          for ep in "sport_events/$id/summary.json" "sport_events/$id/lineups.json" "sport_events/$id/timeline.json"; do
            code=$(curl -sS -m 30 -H "x-api-key: $SR_KEY" -o /tmp/x.json -w '%{http_code}' "$base/$ep")
            echo "== $ep -> HTTP $code"
            python3 - <<'PY'
          import json
          try: d=json.load(open('/tmp/x.json'))
          except Exception as e: print('읽기 실패',e); raise SystemExit
          print('최상위 키:',list(d.keys()))
          st=d.get('sport_event_status',{})
          print('상태:',json.dumps(st,ensure_ascii=False)[:300])
          def walk(o,p=''):
              if isinstance(o,dict):
                  for k,v in o.items():
                      if k in ('lineups','lineup','players','probable_pitchers','pitchers','batting_order','starting_lineup'):
                          print('발견',p+'/'+k, type(v).__name__, (len(v) if hasattr(v,'__len__') else ''))
                      walk(v,p+'/'+k)
              elif isinstance(o,list):
                  for i,v in enumerate(o[:3]): walk(v,p+f'[{i}]')
          walk(d)
          print('lineups 일부:',json.dumps(d.get('lineups'),ensure_ascii=False)[:900])
          print('라인업 후보(statistics):',json.dumps(d.get('statistics'),ensure_ascii=False)[:600])
          PY
          done
      - name: 타임라인 이벤트 실제 모양 (경기 중)
        env:
          SR_KEY: ${{ secrets.SPORTRADAR_KEY }}
        run: |
          set -u
          id=sr:sport_event:76122370
          curl -sS -m 30 -H "x-api-key: $SR_KEY" -o /tmp/t.json "https://api.sportradar.com/baseball/trial/v2/ko/sport_events/$id/timeline.json"
          python3 - <<'PY'
          import json, collections
          d=json.load(open('/tmp/t.json'))
          tl=d.get('timeline',[])
          print('이벤트 수:',len(tl))
          c=collections.Counter(e.get('type') for e in tl)
          print('종류별:',dict(c))
          keys=collections.Counter(k for e in tl for k in e.keys())
          print('필드:',dict(keys))
          for e in tl[:3]: print('처음',json.dumps(e,ensure_ascii=False)[:600])
          for e in tl[-4:]: print('최근',json.dumps(e,ensure_ascii=False)[:600])
          # 한 번만 나오는 종류별 예시
          seen=set()
          for e in tl:
              t=e.get('type')
              if t not in seen:
                  seen.add(t); print('예시',t,json.dumps(e,ensure_ascii=False)[:450])
          PY
