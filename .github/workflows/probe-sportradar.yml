name: probe-sportradar
on:
  push:
    branches: [claude/probe-standings]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: KBO 시즌 순위 엔드포인트 확인 (키는 출력하지 않음)
        env:
          SR_KEY: ${{ secrets.SPORTRADAR_KEY }}
        run: |
          base=https://api.sportradar.com/baseball/trial/v2/en
          get() { sleep 1.2; curl -sS -m 30 -H "x-api-key: $SR_KEY" -H 'accept: application/json' -o "$2" -w '[%{http_code}] ' "$base/$1"; echo "$1"; }
          get "schedules/2026-10-28/summaries.json" /tmp/day.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/day.json'))
          for x in d.get('summaries',[]):
              c=x['sport_event'].get('sport_event_context',{})
              if 'KBO' in c.get('competition',{}).get('name',''):
                  print('competition',c['competition'],'season',c.get('season'),'stage',c.get('stage'),'round',c.get('round'))
                  open('/tmp/season','w').write(c['season']['id']); break
          PY
          s=$(cat /tmp/season); echo "season=$s"
          get "seasons/$s/standings.json" /tmp/st.json
          head -c 1500 /tmp/st.json; echo
          get "seasons/$s/summaries.json" /tmp/sum.json
          python3 -c "
          import json;d=json.load(open('/tmp/sum.json'));print(list(d.keys()),len(d.get('summaries',[])))" || head -c 300 /tmp/sum.json
