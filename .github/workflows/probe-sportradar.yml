name: probe-sportradar
on:
  push:
    branches: [claude/probe-standings]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: 429 원인 확인 (한 번만, 키는 출력하지 않음)
        env:
          SR_KEY: ${{ secrets.SPORTRADAR_KEY }}
        run: |
          curl -sS -m 30 -D /tmp/h.txt -H "x-api-key: $SR_KEY" -H 'accept: application/json' -o /tmp/b.json "https://api.sportradar.com/baseball/trial/v2/en/schedules/2026-10-28/summaries.json" -w '[%{http_code}]\n'
          grep -iE '^(x-|retry|content-type|http)' /tmp/h.txt | grep -vi 'x-api-key' || true
          head -c 400 /tmp/b.json; echo
