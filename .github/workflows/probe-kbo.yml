name: Probe KBO

# KBO 공식 사이트의 1군 등록현황(엔트리) 페이지가 읽을 수 있는 모양인지 확인합니다. 읽기만 하고 아무것도 저장하지 않습니다.
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: robots.txt
        run: |
          curl -sS -m 20 -A "HIT-app-probe/0.1" https://www.koreabaseball.com/robots.txt | head -40
      - name: 등록현황 페이지 구조
        run: |
          set +e
          for P in /Player/Register.aspx /Player/RegisterAll.aspx /Schedule/GameCenter/Main.aspx; do
            echo "=================== $P"
            curl -sS -m 25 -L -A "HIT-app-probe/0.1" -o /tmp/p.html -w 'HTTP %{http_code} %{size_download}바이트\n' "https://www.koreabaseball.com$P"
            python3 - <<'PY'
          import re, html
          s = open('/tmp/p.html', encoding='utf-8', errors='replace').read()
          t = re.search(r'<title>(.*?)</title>', s, re.S)
          print('title:', re.sub(r'\s+', ' ', t.group(1)).strip() if t else None)
          tables = re.findall(r'<table.*?</table>', s, re.S)
          print('tables:', len(tables))
          def text(x): return re.sub(r'\s+', ' ', html.unescape(re.sub(r'<[^>]+>', ' ', x))).strip()
          for i, tb in enumerate(tables[:3]):
              rows = re.findall(r'<tr.*?</tr>', tb, re.S)
              print(f'--- table {i}: {len(rows)} rows')
              for r in rows[:5]:
                  cells = [text(c) for c in re.findall(r'<t[hd].*?</t[hd]>', r, re.S)]
                  print('   ', cells[:10])
          # 팀·날짜 선택 컨트롤(이름만)과 폼 필드
          print('select/input names:', sorted(set(re.findall(r'<(?:select|input)[^>]*name="([^"]+)"', s)))[:25])
          print('data/json endpoints:', sorted(set(re.findall(r'["\'](/[\w/]*\.(?:asmx|ashx|aspx)(?:/\w+)?)["\']', s)))[:15])
          PY
          done
