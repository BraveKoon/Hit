name: Server check

# 배포한 서버가 제대로 데이터를 가져오는지 GitHub 서버에서 호출해 보고, Fly 로그 끝부분을 보여 줍니다.
# 개인정보나 비밀 값은 출력하지 않습니다 (응답은 앞부분만, 긴 16진 문자열은 가립니다).
on:
  workflow_dispatch:
    inputs:
      date:
        description: "경기 날짜 (YYYY-MM-DD, 비우면 오늘 한국 날짜)"
        required: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: 주소 호출
        run: |
          APP=$(sed -n "s/^app = '\(.*\)'/\1/p" server/fly.toml)
          BASE="https://${APP}.fly.dev"
          D="${{ inputs.date }}"; [ -n "$D" ] || D=$(TZ=Asia/Seoul date +%F)
          Y=${D%%-*}
          show() {
            echo "=== $1"
            CODE=$(curl -sS -m 40 -o /tmp/out.txt -w '%{http_code} %{time_total}s' "$BASE$1" 2>&1) || true
            echo "HTTP $CODE, $(wc -c < /tmp/out.txt 2>/dev/null) bytes"
            head -c 700 /tmp/out.txt 2>/dev/null | sed -E 's/[0-9a-fA-F]{32,}/<hex>/g'; echo
          }
          show /health
          show "/v1/games?date=$D"
          show "/v1/standings?season=$Y"
          show "/v1/players?q=%EB%94%94%EC%95%84%EC%A6%88"
          show "/v1/leaders?type=hitter"
          show "/v1/postseason?season=$Y"
      - name: Fly 로그
        if: env.FLY_API_TOKEN != ''
        run: |
          APP=$(sed -n "s/^app = '\(.*\)'/\1/p" server/fly.toml)
          flyctl logs -a "$APP" --no-tail 2>&1 | tail -n 60 | sed -E 's/[0-9a-fA-F]{32,}/<hex>/g'
          echo "---"; flyctl status -a "$APP" 2>&1 | head -20
      - name: 접속 가능한 주소 찾기 (GitHub 미국 서버 / Fly 도쿄 서버)
        run: |
          set +e
          APP=$(sed -n "s/^app = '\(.*\)'/\1/p" server/fly.toml)
          UA="Mozilla/5.0 (iPhone; CPU iPhone OS 18_0 like Mac OS X) AppleWebKit/605.1.15 Mobile/15E148"
          NAVER_API="https://api-gw.sports.naver.com/schedule/games?upperCategoryId=kbaseball&fromDate=2026-10-27&toDate=2026-10-27&size=5"
          URLS=(
            "$NAVER_API"
            "https://api-gw.sports.naver.com"
            "https://m.sports.naver.com/kbaseball/index"
            "https://sports.naver.com/kbaseball/index"
            "https://www.naver.com"
            "https://sports.daum.net/baseball"
            "https://www.koreabaseball.com/Schedule/ScoreBoard.aspx"
            "https://www.koreabaseball.com/ws/Schedule.asmx/GetScheduleList"
            "https://www.statiz.co.kr"
            "https://example.com"
          )
          echo "### GitHub 러너(미국)에서 — 연결/TLS/첫 응답 시간"
          for U in "${URLS[@]}"; do
            R=$(curl -sS -m 12 -o /tmp/b.txt -A "$UA" -e "https://m.sports.naver.com/" -w 'HTTP %{http_code} 연결 %{time_connect}s TLS %{time_appconnect}s 첫응답 %{time_starttransfer}s' "$U" 2>&1 | tail -1)
            echo "${U:0:70}  →  ${R:0:140}"
          done
          echo; echo "### DNS (GitHub 러너)"
          getent hosts api-gw.sports.naver.com | head -3
          echo; echo "### Fly(도쿄)에서"
          T='const t=Date.now(),u=process.argv[1];fetch(u,{headers:{"User-Agent":"Mozilla/5.0 (iPhone)","Referer":"https://m.sports.naver.com/"},signal:AbortSignal.timeout(10000)}).then(r=>console.log(u.slice(0,70),"→",r.status,(Date.now()-t)+"ms")).catch(e=>console.log(u.slice(0,70),"→ 실패",e.name,(e.cause&&(e.cause.code||e.cause.message))||"",(Date.now()-t)+"ms"))'
          for U in "${URLS[@]}"; do
            flyctl ssh console -a "$APP" -C "node -e '$T' '$U'" 2>&1 | tail -1
          done
          echo "Fly 공개 IP:"; flyctl ssh console -a "$APP" -C "node -e 'fetch(\"https://api.ipify.org\").then(r=>r.text()).then(console.log).catch(e=>console.log(\"실패\"))'" 2>&1 | tail -1
          exit 0
