name: Server check

# 배포한 서버가 제대로 데이터를 가져오는지 GitHub 서버에서 호출해 보고, Fly 로그 끝부분을 보여 줍니다.
# 개인정보나 비밀 값은 출력하지 않습니다 (응답은 앞부분만, 긴 16진 문자열은 가립니다).
on:
  workflow_dispatch:
    inputs:
      date:
        description: "경기 날짜 (YYYY-MM-DD, 비우면 오늘 한국 날짜)"
        required: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: 주소 호출
        run: |
          APP=$(sed -n "s/^app = '\(.*\)'/\1/p" server/fly.toml)
          BASE="https://${APP}.fly.dev"
          D="${{ inputs.date }}"; [ -n "$D" ] || D=$(TZ=Asia/Seoul date +%F)
          Y=${D%%-*}
          show() {
            echo "=== $1"
            CODE=$(curl -sS -m 40 -o /tmp/out.txt -w '%{http_code} %{time_total}s' "$BASE$1" 2>&1) || true
            echo "HTTP $CODE, $(wc -c < /tmp/out.txt 2>/dev/null) bytes"
            head -c 700 /tmp/out.txt 2>/dev/null | sed -E 's/[0-9a-fA-F]{32,}/<hex>/g'; echo
          }
          show /health
          show "/v1/games?date=$D"
          show "/v1/standings?season=$Y"
          show "/v1/players?q=%EB%94%94%EC%95%84%EC%A6%88"
          show "/v1/leaders?type=hitter"
          show "/v1/postseason?season=$Y"
      - name: Fly 로그
        if: env.FLY_API_TOKEN != ''
        run: |
          APP=$(sed -n "s/^app = '\(.*\)'/\1/p" server/fly.toml)
          flyctl logs -a "$APP" --no-tail 2>&1 | tail -n 60 | sed -E 's/[0-9a-fA-F]{32,}/<hex>/g'
          echo "---"; flyctl status -a "$APP" 2>&1 | head -20
      - name: 네이버 접속 비교 (GitHub 서버 vs Fly 서버)
        run: |
          URL="https://api-gw.sports.naver.com/schedule/games?fields=basic&upperCategoryId=kbaseball&categoryId=kbo&fromDate=2026-10-27&toDate=2026-10-27&size=5"
          UA="Mozilla/5.0 (compatible; HIT/0.1)"
          echo "=== GitHub 러너에서 (미국) — 네이버"
          curl -sS -m 15 -o /tmp/n.txt -w 'HTTP %{http_code} %{time_total}s\n' -H "Referer: https://m.sports.naver.com/" -H "User-Agent: $UA" "$URL" 2>&1 | tail -2; head -c 200 /tmp/n.txt; echo
          echo "=== GitHub 러너에서 — naver.com 메인"
          curl -sS -m 15 -o /dev/null -w 'HTTP %{http_code} %{time_total}s\n' https://www.naver.com 2>&1 | tail -1
          APP=$(sed -n "s/^app = '\(.*\)'/\1/p" server/fly.toml)
          T='const t=Date.now();const u=process.argv[1];fetch(u,{headers:{Referer:"https://m.sports.naver.com/","User-Agent":"Mozilla/5.0 (compatible; HIT/0.1)"},signal:AbortSignal.timeout(12000)}).then(async r=>{const b=await r.text();console.log(u.slice(0,45),"→",r.status,(Date.now()-t)+"ms",b.slice(0,120).replace(/\n/g," "))}).catch(e=>console.log(u.slice(0,45),"→ 실패",e.name,e.cause&&(e.cause.code||e.cause.message),(Date.now()-t)+"ms"))'
          for U in "$URL" "https://www.naver.com" "https://m.sports.naver.com" "https://example.com" "https://api.open-meteo.com/v1/forecast?latitude=35&longitude=128&hourly=temperature_2m&forecast_days=1"; do
            echo "=== Fly(도쿄)에서: ${U:0:60}"
            flyctl ssh console -a "$APP" -C "node -e '$T' '$U'" 2>&1 | tail -2
          done
          echo "=== Fly 서버의 공개 IP"
          flyctl ssh console -a "$APP" -C "node -e 'fetch(\"https://api.ipify.org\").then(r=>r.text()).then(console.log).catch(e=>console.log(\"ipify 실패\",e.cause&&e.cause.code))'" 2>&1 | tail -1

