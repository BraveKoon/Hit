name: TestFlight

# Actions 탭 → TestFlight → Run workflow 로 실행합니다. 설정 방법은 ios/TESTFLIGHT.md 참고.
on:
  workflow_dispatch:

jobs:
  upload:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      APP_BUNDLE_ID: ${{ vars.APP_BUNDLE_ID }}
      APP_GROUP_ID: ${{ vars.APP_GROUP_ID }}
      DEVELOPMENT_TEAM: ${{ vars.DEVELOPMENT_TEAM }}
      HIT_API_BASE_URL: ${{ vars.HIT_API_BASE_URL }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: 설정 확인
        run: |
          # 서버 주소 변수가 비어 있으면 server/fly.toml 의 Fly 앱 주소를 쓴다
          case "$HIT_API_BASE_URL" in
            ""|"https://"|"https:///")
              FLY_APP=$(sed -n "s/^app = '\(.*\)'/\1/p" server/fly.toml)
              if [ -n "$FLY_APP" ]; then
                HIT_API_BASE_URL="https://${FLY_APP}.fly.dev"
                echo "HIT_API_BASE_URL=$HIT_API_BASE_URL" >> "$GITHUB_ENV"
                echo "서버 주소 변수가 비어 있어 Fly 주소를 씁니다: $HIT_API_BASE_URL"
              fi ;;
          esac
          for v in APP_BUNDLE_ID APP_GROUP_ID DEVELOPMENT_TEAM HIT_API_BASE_URL ASC_KEY_ID ASC_ISSUER_ID; do
            [ -n "${!v}" ] || { echo "::error::$v 값이 비어 있습니다 (ios/TESTFLIGHT.md 참고)"; exit 1; }
          done
          case "$HIT_API_BASE_URL" in https://*) ;; *) echo "::error::HIT_API_BASE_URL 은 https 주소여야 합니다"; exit 1;; esac

      - name: Xcode 26 선택
        run: |
          # App Store Connect 는 iOS 26 SDK(Xcode 26 이상)로 빌드한 앱만 받는다.
          echo "설치된 Xcode: $(ls -d /Applications/Xcode*.app | tr '\n' ' ')"
          XC=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | grep -v -i beta | sort -V | tail -1)
          [ -n "$XC" ] || XC=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          [ -n "$XC" ] || { echo "::error::이 러너에는 Xcode 26 이 없습니다. runs-on 을 macos-26 으로 바꿔 보세요."; exit 1; }
          sudo xcode-select -s "$XC/Contents/Developer"
          xcodebuild -version
          xcodebuild -showsdks | grep -i 'iOS 2' || true

      - name: XcodeGen 설치 · 프로젝트 생성
        working-directory: ios
        run: |
          brew install xcodegen
          xcodegen

      - name: App Store Connect API 키 저장
        env:
          ASC_KEY_RAW: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          KEY=~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8
          # 시크릿은 .p8 파일 전체를 base64 로 바꾼 값이어야 하지만, 원문을 그대로 붙여 넣은 경우도 읽는다.
          if printf '%s' "$ASC_KEY_RAW" | grep -q 'BEGIN'; then
            TEXT=$ASC_KEY_RAW
          else
            TEXT=$(printf '%s' "$ASC_KEY_RAW" | tr -d ' \r\n\t' | base64 --decode 2>/dev/null || true)
          fi
          # 붙여 넣다가 줄바꿈이 공백·\n 글자로 바뀌거나 따옴표·CR·표시 줄 변형이 있어도
          # BEGIN/END 표시를 떼고 본문만 뽑아 64자 줄로 다시 조립한다.
          # BEGIN 표시 앞과 END 표시 뒤에 따라 붙은 글자("App Store Connect" 등)는 버리고 둘 사이만 쓴다.
          FLAT=$(printf '%s' "$TEXT" | sed -e 's/\\n/ /g' | tr '\r\n' '  ')
          if printf '%s' "$FLAT" | grep -q -- '-----BEGIN [A-Z ]*-----' && printf '%s' "$FLAT" | grep -q -- '-----END [A-Z ]*-----'; then
            FLAT=$(printf '%s' "$FLAT" | sed -e 's/^.*-----BEGIN [A-Z ]*-----//' -e 's/-----END [A-Z ]*-----.*$//')
          else
            FLAT=$(printf '%s' "$FLAT" | sed -e 's/-----[A-Z ]*-----//g')
          fi
          BODY=$(printf '%s' "$FLAT" | tr -d ' \t"'"'"'')
          { echo "-----BEGIN PRIVATE KEY-----"; printf '%s' "$BODY" | fold -w 64; echo; echo "-----END PRIVATE KEY-----"; } > "$KEY"
          # 키가 올바른지 먼저 확인해서, 아니면 원인을 알려 주고 멈춘다 (키 내용은 출력하지 않는다)
          if ! OSSL_ERR=$(openssl pkey -in "$KEY" -noout 2>&1); then
            echo "::error::ASC_KEY_P8_BASE64 값을 .p8 키로 읽지 못했습니다. AuthKey_XXXX.p8 파일 전체를 base64 로 바꿔 다시 저장하세요 (ios/TESTFLIGHT.md 참고)."
            echo "진단(키 내용은 출력하지 않음)"
            echo "- 저장된 값: $(printf '%s' "$ASC_KEY_RAW" | wc -c | tr -d ' ')자, 원문 BEGIN 표시: $(printf '%s' "$ASC_KEY_RAW" | grep -c 'BEGIN')줄"
            echo "- 풀어서 얻은 글: $(printf '%s' "$TEXT" | wc -c | tr -d ' ')바이트, 줄 수 $(printf '%s\n' "$TEXT" | wc -l | tr -d ' ')"
            echo "- 표시 줄: $(printf '%s\n' "$TEXT" | grep -- '-----' | tr -d '\r' | tr '\n' '|')"
            echo "- 줄별 글자 수: $(printf '%s\n' "$TEXT" | awk '{printf "%d ", length($0)}')"
            echo "- 풀린 글에서 base64 에 못 쓰는 글자 수(표시 줄 제외): $(printf '%s' "$TEXT" | grep -v -- '-----' | tr -d 'A-Za-z0-9+/=\r\n\t ' | wc -c | tr -d ' ')"
            echo "- 다시 조립한 본문: $(printf '%s' "$BODY" | wc -c | tr -d ' ')자 (Apple 키는 보통 200자, 공개키 없는 형식은 184자)"
            echo "- openssl: $(openssl version) / $(printf '%s' "$OSSL_ERR" | head -c 300)"
            exit 1
          fi
          echo "API 키 확인 완료 (Key ID: $ASC_KEY_ID)"

      - name: 아카이브
        working-directory: ios
        run: |
          xcodebuild archive \
            -project HIT.xcodeproj -scheme HIT -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/HIT.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8 \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            APP_BUNDLE_ID="$APP_BUNDLE_ID" APP_GROUP_ID="$APP_GROUP_ID" \
            DEVELOPMENT_TEAM="$DEVELOPMENT_TEAM" HIT_API_BASE_URL="$HIT_API_BASE_URL" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}"

      - name: 내보내기 · TestFlight 업로드
        working-directory: ios
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${DEVELOPMENT_TEAM}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/HIT.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8 \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
